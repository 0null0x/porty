<!doctype html>
<!--
  A probe for browsers the UI tests do not drive (WebKit, Firefox): does a
  synchronous XMLHttpRequest issued by a dedicated worker pass through the
  page's service worker, and does the disk cache (web/js/diskcache-sw.js)
  then store and serve the chunk?  QEMU fetches its disk and snapshot chunks
  exactly like this.  Copied into an assembled site next to index.html and
  run by tests/ui/diskcache-probe.mjs; the result is window.__probe.
  SPDX-License-Identifier: GPL-2.0-or-later
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Porty disk cache probe</title>
<script>
window.coi = { coepCredentialless: function () { return false; } };
</script>
<script src="coi-serviceworker.js"></script>
</head>
<body>
<pre id="out">running</pre>
<script type="module">
import { DiskCache, PREFIX, snapshotVersion } from './js/diskcache.js';

const base = new URL('.', location.href).href;
const fetchLoop = `onmessage = (e) => {
    const out = [];
    for (const url of e.data.urls) {
        const t = performance.now();
        try {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', url, false);
            xhr.responseType = 'arraybuffer';
            xhr.send(null);
            out.push({ status: xhr.status, bytes: xhr.response ? xhr.response.byteLength : 0, ms: performance.now() - t });
        } catch (err) {
            out.push({ status: -1, bytes: 0, ms: performance.now() - t, error: String(err) });
        }
    }
    postMessage(out);
};`;
// A worker that starts the same loop in a worker of its own.
const nested = `onmessage = (e) => {
    const inner = new Worker(e.data.script);
    inner.onmessage = (m) => postMessage(m.data);
    inner.onerror = (err) => postMessage([{ status: -2, bytes: 0, ms: 0, error: String(err.message || err) }]);
    inner.postMessage({ urls: e.data.urls });
};`;

function run(worker, message) {
    return new Promise((resolve) => {
        const timer = setTimeout(() => resolve([{ status: -3, bytes: 0, ms: 0, error: 'no answer in 30 s' }]), 30000);
        worker.onmessage = (e) => { clearTimeout(timer); worker.terminate(); resolve(e.data); };
        worker.onerror = (e) => { clearTimeout(timer); resolve([{ status: -2, bytes: 0, ms: 0, error: String(e.message || e) }]); };
        worker.postMessage(message);
    });
}

async function probe() {
    const result = {
        userAgent: navigator.userAgent,
        isolated: globalThis.crossOriginIsolated === true,
        sharedArrayBuffer: typeof SharedArrayBuffer === 'function',
        caches: typeof caches === 'object',
        estimate: !!(navigator.storage && navigator.storage.estimate),
        persist: !!(navigator.storage && navigator.storage.persist),
    };
    const json = async (path) => (await fetch(base + path, { cache: 'no-cache' })).json();
    const image = await json('image/manifest.json');
    const snap = await json('snapshot/manifest.json');
    const dc = new DiskCache({ search: location.search, baseUrl: base });
    result.note = await dc.prepare(image.disk);
    result.controlled = !!navigator.serviceWorker.controller;
    result.persisted = dc.persisted;
    const count = Math.min(3, Math.ceil(image.disk.size / image.disk.chunk_size));
    const diskUrls = Array.from({ length: count }, (_, i) => `${base}image/${image.disk.dir}/${String(i).padStart(6, '0')}.bin`);
    const snapUrls = snap.chunks.map((c) => `${base}snapshot/${c.file}?v=${c.sha256.slice(0, 16)}&s=${snapshotVersion(snap)}`);
    const half = Math.ceil(snapUrls.length / 2);
    const blobUrl = URL.createObjectURL(new Blob([fetchLoop], { type: 'text/javascript' }));
    // 1. a worker from a script URL (as Emscripten starts QEMU's threads)
    result.urlWorker = await run(new Worker(`${base}diskcache-probe-worker.js`), { urls: diskUrls });
    // 2. a worker from a blob URL (as the UI tests' fake QEMU does)
    result.blobWorker = await run(new Worker(blobUrl), { urls: snapUrls.slice(0, half) });
    // 3. a worker started by a worker
    result.nestedWorker = await run(new Worker(URL.createObjectURL(new Blob([nested], { type: 'text/javascript' }))),
        { script: `${base}diskcache-probe-worker.js`, urls: snapUrls.slice(half) });
    // Writes finish after the answers.
    await new Promise((resolve) => setTimeout(resolve, 1500));
    result.stats = await dc.stats();
    result.stored = {};
    for (const name of await caches.keys()) {
        if (name.startsWith(PREFIX)) {
            result.stored[name] = (await (await caches.open(name)).keys()).length;
        }
    }
    result.usage = await dc.usage(image.disk, snap);
    result.expected = { disk: diskUrls.length, snapshot: snapUrls.length };
    return result;
}

probe().catch((e) => ({ error: String((e && e.stack) || e) })).then((result) => {
    document.getElementById('out').textContent = JSON.stringify(result, null, 1);
    window.__probe = result;
});
</script>
</body>
</html>
