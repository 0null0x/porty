# Compares Gallery launches in headless Chrome between page settings, all in
# one job on one runner: assembles the site of a ref from the caches (as
# branch-boot-test.yml does, with the resume snapshot when one is cached for
# it), and then visits it once per variant and round in the same browser
# profile, each visit resuming the saved Android and tapping Gallery
# (tests/boot/boot-test.mjs with PROBE_STEPS=launch).  Runners differ by more
# than 2x in guest speed, so variants are only compared within a job.
#
# A variant is a query (page parameters that keep the resume, such as jit=,
# jitcap= or jitgc=) and optionally a command line typed into Android's root
# shell when it answers (for properties an app reads when it starts, such
# as debug.hwui.renderer).  Page parameters that shape the machine veto the
# resume and boot instead (web/js/snapshot.js, MACHINE_PARAMS).
#
#   gh workflow run launch-compare.yml -R <owner>/<repo> --ref swarm/<you> \
#     -f queries='wasmmem=1280&jitcap=15000;wasmmem=1280&jitcap=15000&jitgc=0' -f rounds=2
#
# The run never fails, because every failed run emails the repository
# owner.  The verdict is the commit status "porty/launch-compare ..." and
# the job summary (tests/boot/launch-report.py); the log has everything else.
name: Launch compare

on:
  # A push of this file runs it once with the defaults (and registers it,
  # so that it can be started by hand).
  push:
    branches: ['swarm/**']
    paths:
      - .github/workflows/launch-compare.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to test (default, the branch the run is started on)
        type: string
        default: ''
      queries:
        description: Page parameters per variant, separated by ";"
        type: string
        default: 'wasmmem=1280&jitcap=15000'
      shells:
        description: Shell command lines per variant, separated by ";" in the same order (may be empty; use && inside one)
        type: string
        default: ''
      rounds:
        description: Rounds over all variants (the order is reversed every other round)
        type: number
        default: 1
      probe_wait:
        description: Seconds the probe follows the launch after the tap
        type: number
        default: 420
      env:
        description: More environment for the boot test, NAME=value separated by spaces
        type: string
        default: ''

permissions:
  contents: read
  statuses: write

concurrency:
  group: launch-compare-${{ github.ref }}-${{ inputs.ref }}-${{ inputs.queries }}-${{ inputs.shells }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  compare:
    name: Gallery launches by variant
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Read pinned versions
        id: versions
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        run: |
          source build/versions.env
          {
            echo "qemu_commit=$QEMU_WASM_COMMIT"
            echo "wasm_memory_mb=$WASM_MEMORY_MB"
            echo "iso_sha1=$ANDROID_ISO_SHA1"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          git log -1 --oneline

      # The keys of build-and-deploy.yml, branch-check.yml and snapshot.yml.
      - name: Restore the QEMU-Wasm build
        id: qemu-cache
        if: steps.versions.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/qemu
          key: qemu-${{ steps.versions.outputs.qemu_commit }}-${{ steps.versions.outputs.wasm_memory_mb }}-${{ hashFiles('patches/qemu-wasm/**', 'build/build-qemu.sh', 'build/pc-bios.list', 'scripts/wasm-info.py') }}

      - name: Restore the prepared Android image
        id: image-cache
        if: steps.qemu-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/image
          key: android-image-${{ steps.versions.outputs.iso_sha1 }}-${{ hashFiles('scripts/prepare-image.sh', 'scripts/slim-system.py', 'build/slim-remove.list', 'build/versions.env') }}

      - name: Restore the resume snapshot
        id: snapshot-cache
        if: steps.qemu-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/artifact/snapshot
          key: android-snapshot-${{ steps.versions.outputs.iso_sha1 }}-${{ hashFiles('scripts/prepare-image.sh', 'scripts/slim-system.py', 'build/slim-remove.list', 'build/versions.env') }}-${{ hashFiles('patches/qemu-wasm/**') }}-${{ hashFiles('web/js/qemu-args.js', 'web/js/config.js', 'web/js/boot-diet.js', 'web/js/initramfs.js', 'scripts/snapshot/**') }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.qemu-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        with:
          node-version: 22

      - name: Assemble the site
        id: site
        if: steps.qemu-cache.outputs.cache-hit == 'true' && steps.image-cache.outputs.cache-hit == 'true' && steps.snapshot-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          SHA: ${{ steps.versions.outputs.sha }}
        run: |
          (cd web && npm ci --ignore-scripts --no-audit --no-fund)
          (cd tests/ui && npm ci --ignore-scripts --no-audit --no-fund)
          scripts/assemble-site.sh --qemu out/qemu --image out/image --out dist --id "$SHA" --snapshot out/artifact/snapshot
          du -sb dist

      - name: Visits
        id: visits
        if: steps.site.outcome == 'success'
        continue-on-error: true
        env:
          PUPPETEER_DIR: ${{ github.workspace }}/tests/ui
          QUERIES: ${{ inputs.queries }}
          SHELLS: ${{ inputs.shells }}
          ROUNDS: ${{ inputs.rounds || 1 }}
          PROBE_WAIT_S: ${{ inputs.probe_wait || 420 }}
          EXTRA_ENV: ${{ inputs.env }}
        run: |
          CHROME="$(command -v google-chrome || command -v chromium)"
          export CHROME SITE_URL="http://127.0.0.1:8080/"
          cpu="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs || true)"
          echo "runner CPU: ${cpu:-unknown}, $(nproc) threads"
          work="$RUNNER_TEMP/compare"
          mkdir -p "$work"
          for pair in $EXTRA_ENV; do
            if [[ "$pair" =~ ^[A-Z][A-Z0-9_]*=[A-Za-z0-9_.,:/@%+=-]*$ ]]; then
              export "${pair?}"
              echo "boot test environment: $pair"
            else
              echo "::warning::ignored '$pair' (not NAME=value)"
            fi
          done
          export PROBE_STEPS=launch PROBE_WAIT="$PROBE_WAIT_S" MINUTES=45
          # One profile for every visit: after the first, the saved Android
          # comes from the device (the disk cache), as for a returning visitor.
          export USER_DATA_DIR="$work/profile"
          python3 tests/ui/serve.py dist 8080 "--log=$work/server.log" --isolate &
          server=$!
          for _ in $(seq 50); do
            curl -fsS -o /dev/null "${SITE_URL}index.html" 2>/dev/null && break
            sleep 0.2
          done
          IFS=';' read -r -a queries <<< "$QUERIES"
          IFS=';' read -r -a shells <<< "$SHELLS"
          n=${#queries[@]}
          : > "$work/visits.txt"
          for round in $(seq "$ROUNDS"); do
            for k in $(seq 0 $((n - 1))); do
              i=$k
              (( round % 2 == 0 )) && i=$((n - 1 - k))
              export QUERY="${queries[$i]}" SHELL_INIT="${shells[$i]:-}"
              label="v$((i + 1)) r$round ${QUERY}${SHELL_INIT:+ sh: $SHELL_INIT}"
              echo "::group::$label"
              node tests/boot/boot-test.mjs 2>&1 | tee "$work/visit-$i-$round.log" || true
              echo "::endgroup::"
              printf '%s=%s\n' "${label//=/:}" "$work/visit-$i-$round.log" >> "$work/visits.txt"
            done
          done
          kill "$server" 2>/dev/null || true

      - name: Summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.versions.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QEMU: ${{ steps.qemu-cache.outputs.cache-hit }}
          IMAGE: ${{ steps.image-cache.outputs.cache-hit }}
          SNAPSHOT: ${{ steps.snapshot-cache.outputs.cache-hit }}
          QUERIES: ${{ inputs.queries }}
        run: |
          set +e
          work="$RUNNER_TEMP/compare"
          if [[ -s "$work/visits.txt" ]]; then
            mapfile -t args < "$work/visits.txt"
            details="$(python3 -I tests/boot/launch-report.py "${args[@]}" 2>&1)"
          else
            details="failed: no visits (QEMU-Wasm cached: ${QEMU:-no}, image: ${IMAGE:-no}, snapshot: ${SNAPSHOT:-no})"
          fi
          first="$(sed -n 1p <<<"$details")"
          state=success
          grep -q '^ok' <<<"$first" || state=error
          echo "$details"
          {
            echo "## Launch compare"
            echo
            echo "Runner CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
            echo
            sed -n '1,$p' <<<"$details"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${SHA:-}" ]]; then
            gh api "repos/$REPO/statuses/$SHA" -f state="$state" \
              -f context="$(printf 'porty/launch-compare %s' "$QUERIES" | cut -c1-100)" \
              -f description="${first:0:139}" -f target_url="$RUN_URL" >/dev/null || true
          fi
          exit 0
