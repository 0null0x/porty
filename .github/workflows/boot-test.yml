# Boots the deployed site in headless Chrome after every successful
# deployment and logs how far Android gets: the serial console, page status
# and screenshots (base64 JPEG between marker lines; recover them with
# tests/boot/extract-shots.py).  Can also be started by hand with other page
# parameters, e.g. "smp=1" or "mem=1024&res=540x960".
name: Boot test

on:
  workflow_run:
    workflows: [Build and deploy]
    types: [completed]
  workflow_dispatch:
    inputs:
      query:
        description: Extra page parameters, e.g. smp=1&mem=1024
        type: string
        default: ''
      minutes:
        description: Minutes to let Android boot
        type: number
        default: 100
      dump:
        description: Files in QEMU's in-memory filesystem to print at the end (comma separated)
        type: string
        default: ''
      control:
        description: Run QEMU-Wasm's own Alpine x86_64 demo instead of Porty (control experiment)
        type: boolean
        default: false
      shell:
        description: Commands to type into Android's root shell once it is up (experiments, e.g. setprop)
        type: string
        default: ''
      cpu_throttle:
        description: Slow Chrome's renderer down this many times (e.g. 3 or 6 for a phone; 1 = off)
        type: number
        default: 1
      no_http_cache:
        description: Turn the browser's HTTP cache off (dropped disk chunks are downloaded again)
        type: boolean
        default: false
      net_mbps:
        description: Download speed limit in Mbit/s (0 = none)
        type: number
        default: 0
      probe_wait:
        description: Seconds the input probe waits for Gallery to open
        type: number
        default: 240
      probe:
        description: 'Input probe options, comma separated: launch (stop after the Gallery launch), quiet (no guest sampling during it)'
        type: string
        default: ''

permissions:
  contents: read
  statuses: write  # live progress as a commit status (tests/boot/boot-test.mjs)

# A new deployment cancels the boot test of the previous one; hand-started
# runs with different parameters run side by side.
concurrency:
  group: boot-test-${{ github.event_name }}-${{ inputs.query }}-${{ inputs.control }}-${{ inputs.shell }}-${{ inputs.cpu_throttle }}-${{ inputs.no_http_cache }}-${{ inputs.net_mbps }}-${{ inputs.probe }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  boot:
    name: Boot Android in headless Chrome
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install puppeteer-core
        working-directory: tests/ui
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Boot
        env:
          PUPPETEER_DIR: ${{ github.workspace }}/tests/ui
          GITHUB_TOKEN: ${{ github.token }}
          QUERY: ${{ inputs.query }}
          MINUTES: ${{ inputs.minutes }}
          DUMP_FILES: ${{ inputs.dump }}
          CONTROL: ${{ inputs.control }}
          SHELL_INIT: ${{ inputs.shell }}
          CPU_THROTTLE: ${{ inputs.cpu_throttle }}
          NO_HTTP_CACHE: ${{ inputs.no_http_cache }}
          NET_MBPS: ${{ inputs.net_mbps }}
          PROBE_WAIT: ${{ inputs.probe_wait }}
          PROBE_OPTIONS: ${{ inputs.probe }}
        run: |
          # Project site of this repository: https://<owner>.github.io/<repo>/
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          CHROME="$(command -v google-chrome || command -v chromium)"
          export SITE_URL CHROME
          export MINUTES="${MINUTES:-100}"
          # Phone-like conditions and input probe options (boot-test.mjs).
          export CPU_THROTTLE="${CPU_THROTTLE:-1}" NET_MBPS="${NET_MBPS:-0}" PROBE_WAIT="${PROBE_WAIT:-240}"
          [[ "${NO_HTTP_CACHE:-false}" == true ]] && export NO_HTTP_CACHE=1 || export NO_HTTP_CACHE=0
          [[ ",${PROBE_OPTIONS:-}," == *,launch,* ]] && export PROBE_STEPS=launch
          [[ ",${PROBE_OPTIONS:-}," == *,quiet,* ]] && export PROBE_GUEST_EVERY=0
          nproc
          free -m
          "$CHROME" --version
          if [[ "${CONTROL:-false}" == true ]]; then
            node tests/boot/control-demo.mjs
          else
            node tests/boot/boot-test.mjs
          fi
