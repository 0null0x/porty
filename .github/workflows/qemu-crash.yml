# QEMU crash hunt: QEMU-Wasm's threads sometimes die of an uncaught
# Emscripten longjmp ("Uncaught Infinity") or "memory access out of bounds".
#
#   mode=glue    prints the QEMU-Wasm build of this branch's patches (out.js,
#                the worker glue and the .wasm, gzip+base64 between marker
#                lines) so that call frames can be mapped to code; the
#                Pages site and artifact downloads are not reachable from
#                every place the logs are read.
#   mode=stress  boots this branch's site (assembled from the caches, as
#                branch-boot-test.yml does) in several jobs at once, drives
#                taps, clicks, swipes and the Home and Back keys after the
#                boot (STRESS_MINUTES of the boot test) or leaves the guest
#                alone, and counts worker exceptions.  With trace on, the
#                glue is instrumented (tests/boot/longjmp-trace.mjs) so that
#                a longjmp that no setjmp frame will catch prints where it
#                was thrown from.
#
# A push of this file or of tests/boot/qemu-crash.json runs what that JSON
# file says; a manual start takes the same settings as inputs:
#   gh workflow run qemu-crash.yml -R <owner>/<repo> --ref swarm/qemu-crash \
#     -f mode=stress -f variants='["full-input","resume-input"]' -f reps='[1,2,3]'
#
# The run never fails, because every failed run emails the repository owner.
# Verdicts are commit statuses ("porty/crash ...") and job summaries.
name: QEMU crash

on:
  push:
    branches: [swarm/qemu-crash]
    paths:
      - .github/workflows/qemu-crash.yml
      - tests/boot/qemu-crash.json
  workflow_dispatch:
    inputs:
      mode:
        description: glue or stress
        type: string
        default: stress
      variants:
        description: 'JSON list of variants: full-input, full-quiet, resume-input, resume-quiet (a suffix ":<query>" adds page parameters)'
        type: string
        default: '["full-input","full-quiet","resume-input","resume-quiet"]'
      reps:
        description: JSON list, one job per element and variant
        type: string
        default: '[1,2]'
      minutes:
        description: Minutes per job
        type: number
        default: 70
      stress_minutes:
        description: Minutes of input after the boot (the -input variants)
        type: number
        default: 45
      trace:
        description: 'Instrument the glue (tests/boot/longjmp-trace.mjs flags): 0 off, 1 report an uncaught longjmp, +2 the last 8 longjmps (allocates per longjmp), +4 C stack depth'
        type: string
        default: '1'
      patches_from:
        description: Commit whose QEMU-Wasm build (patches and build script) to test, e.g. a main commit for the build without this branch's patches; empty is this commit's
        type: string
        default: ''

permissions:
  contents: read
  statuses: write

concurrency:
  group: qemu-crash-${{ github.ref }}-${{ github.event_name }}-${{ inputs.mode }}-${{ inputs.variants }}-${{ inputs.reps }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  setup:
    name: Settings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.s.outputs.mode }}
      variants: ${{ steps.s.outputs.variants }}
      reps: ${{ steps.s.outputs.reps }}
      minutes: ${{ steps.s.outputs.minutes }}
      stress_minutes: ${{ steps.s.outputs.stress_minutes }}
      trace: ${{ steps.s.outputs.trace }}
      patches_from: ${{ steps.s.outputs.patches_from }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Settings
        id: s
        env:
          EVENT: ${{ github.event_name }}
          I_MODE: ${{ inputs.mode }}
          I_VARIANTS: ${{ inputs.variants }}
          I_REPS: ${{ inputs.reps }}
          I_MINUTES: ${{ inputs.minutes }}
          I_STRESS: ${{ inputs.stress_minutes }}
          I_TRACE: ${{ inputs.trace }}
          I_PATCHES_FROM: ${{ inputs.patches_from }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            python3 -I - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          print('mode=' + os.environ['I_MODE'])
          print('variants=' + json.dumps(json.loads(os.environ['I_VARIANTS'])))
          print('reps=' + json.dumps(json.loads(os.environ['I_REPS'])))
          print('minutes=%d' % int(float(os.environ['I_MINUTES'] or 70)))
          print('stress_minutes=%d' % int(float(os.environ['I_STRESS'] or 45)))
          print('trace=%d' % (int(os.environ['I_TRACE']) if os.environ['I_TRACE'].isdigit() else 0))
          ref = os.environ.get('I_PATCHES_FROM', '').strip()
          print('patches_from=' + (ref if all(c in '0123456789abcdefABCDEF' for c in ref) and len(ref) <= 40 else ''))
          EOF
          else
            python3 -I - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open('tests/boot/qemu-crash.json'))
          print('mode=' + c.get('mode', 'stress'))
          print('variants=' + json.dumps(c.get('variants', ['full-input'])))
          print('reps=' + json.dumps(c.get('reps', [1])))
          print('minutes=%d' % int(c.get('minutes', 70)))
          print('stress_minutes=%d' % int(c.get('stress_minutes', 45)))
          print('trace=%d' % int(c.get('trace', 1)))
          print('patches_from=' + str(c.get('patches_from', '')))
          EOF
          fi
          cat "$GITHUB_OUTPUT"

  glue:
    name: Print the QEMU-Wasm build
    needs: setup
    if: needs.setup.outputs.mode == 'glue'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned versions
        id: versions
        run: |
          source build/versions.env
          {
            echo "qemu_commit=$QEMU_WASM_COMMIT"
            echo "wasm_memory_mb=$WASM_MEMORY_MB"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the QEMU-Wasm build
        id: qemu-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/qemu
          key: qemu-${{ steps.versions.outputs.qemu_commit }}-${{ steps.versions.outputs.wasm_memory_mb }}-${{ hashFiles('patches/qemu-wasm/**', 'build/build-qemu.sh', 'build/pc-bios.list', 'scripts/wasm-info.py') }}

      - name: Print
        if: steps.qemu-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        run: |
          cd out/qemu
          ls -l
          sha256sum out.js qemu-system-x86_64.worker.js qemu-system-x86_64.wasm
          for f in out.js qemu-system-x86_64.worker.js qemu-system-x86_64.wasm; do
            echo "-----BEGIN PORTY FILE $f-----"
            gzip -9c "$f" | base64 -w 50000
            echo "-----END PORTY FILE-----"
          done

  stress:
    name: ${{ matrix.variant }} ${{ matrix.rep }}
    needs: setup
    if: needs.setup.outputs.mode == 'stress'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
        rep: ${{ fromJSON(needs.setup.outputs.reps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        continue-on-error: true
        with:
          persist-credentials: false
          fetch-depth: 0

      # The QEMU-Wasm build of another commit (patches_from), with this
      # commit's page and tests: the caches are keyed by the patches.
      - name: Take the QEMU-Wasm patches of another commit
        id: patches
        if: steps.checkout.outcome == 'success' && needs.setup.outputs.patches_from != ''
        continue-on-error: true
        env:
          FROM: ${{ needs.setup.outputs.patches_from }}
        run: |
          rm -rf patches/qemu-wasm
          git checkout "$FROM" -- patches/qemu-wasm build/build-qemu.sh build/pc-bios.list scripts/wasm-info.py
          ls patches/qemu-wasm

      - name: Read pinned versions
        id: versions
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        run: |
          source build/versions.env
          {
            echo "qemu_commit=$QEMU_WASM_COMMIT"
            echo "wasm_memory_mb=$WASM_MEMORY_MB"
            echo "iso_sha1=$ANDROID_ISO_SHA1"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # The keys of branch-boot-test.yml.
      - name: Restore the QEMU-Wasm build
        id: qemu-cache
        if: steps.versions.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/qemu
          key: qemu-${{ steps.versions.outputs.qemu_commit }}-${{ steps.versions.outputs.wasm_memory_mb }}-${{ hashFiles('patches/qemu-wasm/**', 'build/build-qemu.sh', 'build/pc-bios.list', 'scripts/wasm-info.py') }}

      - name: Restore the prepared Android image
        id: image-cache
        if: steps.qemu-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/image
          key: android-image-${{ steps.versions.outputs.iso_sha1 }}-${{ hashFiles('scripts/prepare-image.sh', 'scripts/slim-system.py', 'build/slim-remove.list', 'build/versions.env') }}

      - name: Restore the resume snapshot
        id: snapshot-cache
        if: steps.qemu-cache.outputs.cache-hit == 'true' && startsWith(matrix.variant, 'resume')
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/artifact/snapshot
          key: android-snapshot-${{ steps.versions.outputs.iso_sha1 }}-${{ hashFiles('scripts/prepare-image.sh', 'scripts/slim-system.py', 'build/slim-remove.list', 'build/versions.env') }}-${{ hashFiles('patches/qemu-wasm/**') }}-${{ hashFiles('web/js/qemu-args.js', 'web/js/config.js', 'web/js/boot-diet.js', 'web/js/initramfs.js', 'scripts/snapshot/**') }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.qemu-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        with:
          node-version: 22

      - name: Assemble the site
        id: site
        if: steps.qemu-cache.outputs.cache-hit == 'true' && steps.image-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          HAVE_SNAPSHOT: ${{ steps.snapshot-cache.outputs.cache-hit }}
          SHA: ${{ steps.versions.outputs.sha }}
          TRACE: ${{ needs.setup.outputs.trace }}
        run: |
          (cd web && npm ci --ignore-scripts --no-audit --no-fund)
          (cd tests/ui && npm ci --ignore-scripts --no-audit --no-fund)
          extra=()
          if [[ "$HAVE_SNAPSHOT" == true ]]; then
            extra=(--snapshot out/artifact/snapshot)
          fi
          scripts/assemble-site.sh --qemu out/qemu --image out/image --out dist --id "$SHA" "${extra[@]}"
          if [[ "$TRACE" != 0 ]]; then
            # A copy: dist/qemu may hold hard links into out/qemu.
            cp dist/qemu/out.js "$RUNNER_TEMP/out.js"
            rm dist/qemu/out.js
            cp "$RUNNER_TEMP/out.js" dist/qemu/out.js
            node tests/boot/longjmp-trace.mjs dist/qemu/out.js "$TRACE"
          fi
          sha256sum dist/qemu/out.js dist/qemu/qemu-system-x86_64.wasm

      - name: Boot and stress
        id: boot
        if: steps.site.outcome == 'success'
        continue-on-error: true
        env:
          PUPPETEER_DIR: ${{ github.workspace }}/tests/ui
          VARIANT: ${{ matrix.variant }}
          REP: ${{ matrix.rep }}
          MINUTES: ${{ needs.setup.outputs.minutes }}
          STRESS: ${{ needs.setup.outputs.stress_minutes }}
        run: |
          CHROME="$(command -v google-chrome || command -v chromium)"
          export CHROME SITE_URL="http://127.0.0.1:8080/"
          cpu="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs || true)"
          echo "runner CPU: ${cpu:-unknown}, $(nproc) threads"
          "$CHROME" --version
          kind="${VARIANT%%:*}"
          extra=""
          [[ "$VARIANT" == *:* ]] && extra="${VARIANT#*:}"
          case "$kind" in
            full-*) query="resume=0" ;;
            *) query="" ;;
          esac
          [[ -n "$extra" ]] && query="${query:+$query&}$extra"
          export QUERY="$query" STRESS_MINUTES="$STRESS" STRESS_SEED="$REP" INPUT_PROBE=0 RESUME_SETTLE=60
          case "$kind" in
            *-quiet) export STRESS_INPUT=0 ;;
            *) export STRESS_INPUT=1 ;;
          esac
          echo "variant $VARIANT rep $REP: QUERY='$QUERY' STRESS_MINUTES=$STRESS_MINUTES STRESS_INPUT=$STRESS_INPUT MINUTES=$MINUTES"
          work="$RUNNER_TEMP/stress"
          mkdir -p "$work"
          python3 tests/ui/serve.py dist 8080 "--log=$work/server.log" --isolate &
          server=$!
          for _ in $(seq 50); do
            curl -fsS -o /dev/null "${SITE_URL}index.html" 2>/dev/null && break
            sleep 0.2
          done
          node tests/boot/boot-test.mjs 2>&1 | tee "$work/boot.log" || true
          kill "$server" 2>/dev/null || true
          grep -a "RUN RESULT:" "$work/boot.log" | tail -1 | sed 's/^.*RUN RESULT: //' > "$work/result.json" || true
          echo "cpu=${cpu:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.versions.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VARIANT: ${{ matrix.variant }}
          REP: ${{ matrix.rep }}
          FROM: ${{ needs.setup.outputs.patches_from }}
          SITE: ${{ steps.site.outcome }}
          SNAPSHOT: ${{ steps.snapshot-cache.outputs.cache-hit }}
          CPU: ${{ steps.boot.outputs.cpu }}
        run: |
          result="$RUNNER_TEMP/stress/result.json"
          state=error
          if [[ "$SITE" != success ]]; then text="site not assembled"
          elif [[ ! -s "$result" ]]; then text="no result"
          else
            text="$(python3 -I - "$result" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          s = r.get('stress') or {}
          errs = r.get('workerErrors') or []
          parts = ['booted' if r.get('booted') else 'not booted', '%s min' % r.get('minutes')]
          if errs:
              parts.append('DIED at %d s: %s' % (errs[0]['atS'], errs[0]['text'][:60]))
          else:
              parts.append('no worker exception')
          if s:
              parts.append('stress %s min, %d actions' % (s.get('minutes'), sum((s.get('actions') or {}).values())))
          print(', '.join(parts))
          EOF
          )"
            state=success
            grep -q DIED <<< "$text" && state=failure
          fi
          [[ "$SNAPSHOT" == true ]] && text="$text (resumed snapshot)"
          build="this commit's QEMU-Wasm"
          [[ -n "$FROM" ]] && build="QEMU-Wasm of ${FROM:0:7}"
          text="$text; $build"
          echo "$state: $text; CPU $CPU"
          {
            echo "## $VARIANT $REP"
            echo
            echo "- $text"
            echo "- runner CPU: $CPU"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${SHA:-}" ]]; then
            gh api "repos/$REPO/statuses/$SHA" -f state="$state" \
              -f context="$(printf 'porty/crash %s %s%s' "$VARIANT" "$REP" "${FROM:+ qemu@${FROM:0:7}}" | cut -c1-100)" \
              -f description="$(printf '%s' "$text" | cut -c1-139)" -f target_url="$RUN_URL" >/dev/null || true
          fi
          exit 0
