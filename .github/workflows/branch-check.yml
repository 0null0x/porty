# Checks a work branch (swarm/**) without deploying anything: lint and unit
# tests, the browser test with the fake QEMU, the QEMU-Wasm build with the
# branch's patches, and the image and site pipeline on the real Android-x86
# ISO.  Only main deploys (build-and-deploy.yml); boot tests need the
# deployed site, so they happen after a branch is merged.
#
# The run itself never fails, because every failed run emails the repository
# owner.  The outcome of each part is a commit status on the branch's commit
# ("porty/check lint", "porty/check ui", "porty/check qemu", "porty/check
# site", "porty/check disk", "porty/check native", "porty/check resume") plus
# the job summary; read them with
#   gh api repos/<owner>/<repo>/commits/<sha>/statuses
name: Branch check

on:
  push:
    branches: ['swarm/**']
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: branch-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      outcome: ${{ steps.summary.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck xorriso squashfs-tools e2fsprogs qemu-utils cpio

      - name: Shell scripts
        id: shellcheck
        continue-on-error: true
        run: shellcheck -x build/*.sh scripts/*.sh tests/*.sh tests/ui/*.sh

      - name: JavaScript syntax
        id: syntax
        continue-on-error: true
        run: |
          for f in web/js/*.js tests/*.mjs tests/ui/*.js tests/ui/*.mjs tests/boot/*.mjs; do
            node --check "$f"
          done

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          node tests/wasm-patch.test.mjs
          node tests/unit.test.mjs

      - name: Image and site pipeline on a miniature ISO
        id: smoke
        continue-on-error: true
        run: |
          (cd web && npm ci --ignore-scripts --no-audit --no-fund)
          tests/site-smoke.sh "$RUNNER_TEMP/smoke"

      - name: Summary
        id: summary
        env:
          SHELLCHECK: ${{ steps.shellcheck.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          failed=""
          for pair in "shellcheck:$SHELLCHECK" "syntax:$SYNTAX" "unit:$UNIT" "site-smoke:$SMOKE"; do
            [[ "${pair#*:}" == success ]] || failed+="${pair%%:*} "
          done
          if [[ -z "$failed" ]]; then
            echo "outcome=success|shellcheck, syntax, unit tests and site smoke test passed" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure|failed: ${failed% }" >> "$GITHUB_OUTPUT"
          fi

  ui-test:
    name: Browser test (fake QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      outcome: ${{ steps.summary.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso squashfs-tools e2fsprogs qemu-utils cpio
          (cd web && npm ci --ignore-scripts --no-audit --no-fund)
          (cd tests/ui && npm ci --ignore-scripts --no-audit --no-fund)

      - name: Run the page in headless Chrome
        id: ui
        continue-on-error: true
        env:
          PUPPETEER_DIR: ${{ github.workspace }}/tests/ui
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME
          tests/ui/run.sh "$RUNNER_TEMP/ui"
          tests/ui/run.sh "$RUNNER_TEMP/ui-small" '?wasmmem=1024&mem=512&disk=ide'
          tests/ui/run.sh "$RUNNER_TEMP/ui-touch" '?touch=1'

      - name: Summary
        id: summary
        env:
          UI: ${{ steps.ui.outcome }}
        run: |
          if [[ "$UI" == success ]]; then
            echo "outcome=success|browser test passed (both URLs)" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure|browser test failed, see the log" >> "$GITHUB_OUTPUT"
          fi

  # block/qcow2.c on top of block/porty.c, as the page's -drive stacks them,
  # in a native qemu-img built from the patched tree: every byte of a
  # miniature system disk must read back as its manifest says.
  disk:
    name: Disk drivers (native qemu-img)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      outcome: ${{ steps.summary.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso squashfs-tools e2fsprogs qemu-utils cpio \
            ninja-build pkg-config libglib2.0-dev zlib1g-dev python3-venv

      - name: Build qemu-img from the patched QEMU-Wasm tree
        id: build
        continue-on-error: true
        run: |
          build/apply-patches.sh "$RUNNER_TEMP/qemu-wasm"
          mkdir "$RUNNER_TEMP/qemu-native"
          cd "$RUNNER_TEMP/qemu-native"
          "$RUNNER_TEMP/qemu-wasm/configure" --without-default-features --enable-tools \
            --disable-system --disable-user --disable-docs --disable-werror \
            --with-coroutine=ucontext
          ninja qemu-img

      - name: Read a miniature system disk back through qcow2 and porty
        id: read
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          (cd web && npm ci --ignore-scripts --no-audit --no-fund)
          tests/site-smoke.sh "$RUNNER_TEMP/smoke" >/dev/null
          tests/native-disk.sh "$RUNNER_TEMP/qemu-native/qemu-img" "$RUNNER_TEMP/smoke/image"
          tests/native-disk.sh "$RUNNER_TEMP/qemu-native/qemu-img" "$RUNNER_TEMP/smoke/image-sfs"

      - name: Summary
        id: summary
        env:
          BUILD: ${{ steps.build.outcome }}
          READ: ${{ steps.read.outcome }}
        run: |
          if [[ "$READ" == success ]]; then
            echo "outcome=success|qcow2 and raw disks read back bit for bit through block/porty.c" >> "$GITHUB_OUTPUT"
          elif [[ "$BUILD" != success ]]; then
            echo "outcome=failure|native qemu-img did not build, see the log" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure|disk read-back failed, see the log" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build QEMU-Wasm and the site (no deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      qemu: ${{ steps.summary.outputs.qemu }}
      site: ${{ steps.summary.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned versions
        id: versions
        run: |
          source build/versions.env
          {
            echo "qemu_commit=$QEMU_WASM_COMMIT"
            echo "wasm_memory_mb=$WASM_MEMORY_MB"
            echo "iso_sha1=$ANDROID_ISO_SHA1"
            echo "iso_name=$ANDROID_ISO_NAME"
          } >> "$GITHUB_OUTPUT"

      # The same cache key as build-and-deploy.yml, so a branch whose patches
      # are unchanged reuses main's build.  (Caches a branch saves are not
      # visible to main; main rebuilds after a merge.)
      - name: Restore cached QEMU-Wasm build
        id: qemu-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/qemu
          key: qemu-${{ steps.versions.outputs.qemu_commit }}-${{ steps.versions.outputs.wasm_memory_mb }}-${{ hashFiles('patches/qemu-wasm/**', 'build/build-qemu.sh', 'build/pc-bios.list', 'scripts/wasm-info.py') }}

      - name: Check out QEMU-Wasm and apply the Porty patches
        id: patches
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: build/apply-patches.sh "$RUNNER_TEMP/qemu-wasm"

      - name: Set up Docker Buildx
        id: buildx
        if: steps.qemu-cache.outputs.cache-hit != 'true' && steps.patches.outcome == 'success'
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare an empty Docker build context
        if: steps.qemu-cache.outputs.cache-hit != 'true' && steps.patches.outcome == 'success'
        run: mkdir -p "$RUNNER_TEMP/empty-context"

      # Reads main's toolchain layer cache; branches do not write it.
      - name: Build the toolchain image
        id: toolchain
        if: steps.qemu-cache.outputs.cache-hit != 'true' && steps.patches.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/empty-context
          file: ${{ runner.temp }}/qemu-wasm/Dockerfile
          tags: porty-qemu-build:local
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=qemu-wasm-toolchain

      - name: Compile qemu-system-x86_64 to WebAssembly
        id: compile
        if: steps.qemu-cache.outputs.cache-hit != 'true' && steps.toolchain.outcome == 'success'
        continue-on-error: true
        env:
          WASM_MEMORY_MB: ${{ steps.versions.outputs.wasm_memory_mb }}
        run: |
          mkdir -p out/qemu
          docker run --rm \
            -e WASM_MEMORY_MB \
            -v "$RUNNER_TEMP/qemu-wasm:/qemu" \
            -v "$PWD:/porty:ro" \
            -v "$PWD/out/qemu:/out" \
            porty-qemu-build:local \
            bash /porty/build/build-qemu.sh
          sudo chown -R "$(id -u):$(id -g)" out/qemu
          ls -l out/qemu

      - name: Save the QEMU-Wasm build
        if: steps.qemu-cache.outputs.cache-hit != 'true' && steps.compile.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/qemu
          key: qemu-${{ steps.versions.outputs.qemu_commit }}-${{ steps.versions.outputs.wasm_memory_mb }}-${{ hashFiles('patches/qemu-wasm/**', 'build/build-qemu.sh', 'build/pc-bios.list', 'scripts/wasm-info.py') }}

      - name: Free disk space
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          docker system prune --all --force >/dev/null || true
          sudo rm -rf "$RUNNER_TEMP/qemu-wasm"

      - name: Verify the QEMU-Wasm build
        id: verify
        continue-on-error: true
        env:
          WASM_MEMORY_MB: ${{ steps.versions.outputs.wasm_memory_mb }}
        run: |
          python3 scripts/wasm-info.py out/qemu/qemu-system-x86_64.wasm --expect-memory-mb "$WASM_MEMORY_MB"
          test -s out/qemu/out.js
          test -s out/qemu/qemu-system-x86_64.worker.js
          test -s out/qemu/build-info.json

      - name: Restore cached Android-x86 ISO
        id: iso-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/iso
          key: android-iso-${{ steps.versions.outputs.iso_sha1 }}

      - name: Download and verify the Android-x86 ISO
        id: iso
        continue-on-error: true
        run: scripts/fetch-android.sh out/iso

      - name: Extract kernel, ramdisks and the system disk
        id: image
        if: steps.iso.outcome == 'success'
        continue-on-error: true
        env:
          ISO_NAME: ${{ steps.versions.outputs.iso_name }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso squashfs-tools e2fsprogs qemu-utils cpio
          scripts/prepare-image.sh "out/iso/$ISO_NAME" out/image
          rm -rf out/iso
          du -sb out/image out/image/* | sort -k2

      # What the boot diet (web/js/boot-diet.js) assumes about the real
      # initrd.img, ramdisk.img and /system; the log lists the facts.
      - name: Check the boot diet against the real image
        id: diet
        if: steps.image.outcome == 'success'
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq squashfs-tools busybox-static cpio
          tests/boot-diet-image.sh out/image "$RUNNER_TEMP/boot-diet" --system

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Assemble the site
        id: site
        if: steps.verify.outcome == 'success' && steps.image.outcome == 'success'
        continue-on-error: true
        run: |
          (cd web && npm ci --ignore-scripts --no-audit --no-fund)
          scripts/assemble-site.sh --qemu out/qemu --image out/image --out dist --id "$GITHUB_SHA"
          du -sb dist

      - name: Summary
        id: summary
        env:
          CACHE_HIT: ${{ steps.qemu-cache.outputs.cache-hit }}
          PATCHES: ${{ steps.patches.outcome }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          ISO: ${{ steps.iso.outcome }}
          IMAGE: ${{ steps.image.outcome }}
          SITE: ${{ steps.site.outcome }}
          DIET: ${{ steps.diet.outcome }}
        run: |
          if [[ "$VERIFY" == success ]]; then
            if [[ "$CACHE_HIT" == true ]]; then qemu="success|cached build (patches unchanged)"; else qemu="success|QEMU-Wasm built and verified"; fi
          elif [[ "$PATCHES" == failure ]]; then qemu="failure|patches do not apply"
          elif [[ "$TOOLCHAIN" == failure ]]; then qemu="failure|toolchain image did not build"
          elif [[ "$COMPILE" == failure ]]; then qemu="failure|compile failed, see the log"
          else qemu="failure|build not verified, see the log"; fi
          if [[ "$SITE" == success ]]; then
            size="$(du -sb dist | cut -f1)"
            site="success|site $(( size / 1000000 )) MB (Pages soft limit 1000 MB); boot-diet image check: $DIET"
          elif [[ "$IMAGE" == failure ]]; then site="failure|prepare-image.sh failed"
          elif [[ "$ISO" == failure ]]; then site="failure|ISO download failed"
          else site="failure|site not assembled (QEMU build or image missing)"; fi
          { echo "qemu=$qemu"; echo "site=$site"; } >> "$GITHUB_OUTPUT"
          { echo "## Branch check"; echo; echo "- QEMU-Wasm: ${qemu/|/: }"; echo "- Site: ${site/|/: }"; } >> "$GITHUB_STEP_SUMMARY"

  # The snapshot source of QEMU patch 0012 in a native QEMU built from the
  # patched tree: save a small Linux guest with "migrate file:", pack it as
  # published, resume it through "-incoming porty:" (tests/snapshot-native.sh).
  native:
    name: Native QEMU (snapshot resume)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      outcome: ${{ steps.summary.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Read pinned versions
        id: versions
        run: |
          source build/versions.env
          echo "qemu_commit=$QEMU_WASM_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Install tools
        id: tools
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build python3-venv libglib2.0-dev libpixman-1-dev zlib1g-dev \
            libfdt-dev flex bison xorriso squashfs-tools e2fsprogs qemu-utils busybox-static cpio zstd

      - name: Restore cached native QEMU build
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/qemu-native
          key: qemu-native-${{ steps.versions.outputs.qemu_commit }}-${{ hashFiles('patches/qemu-wasm/**', 'build/pc-bios.list') }}

      - name: Check out QEMU-Wasm and apply the Porty patches
        id: patches
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.tools.outcome == 'success'
        continue-on-error: true
        run: build/apply-patches.sh "$RUNNER_TEMP/qemu-native-src"

      # The configuration docs/PLAN.md, section 5, lists for the native build.
      - name: Compile qemu-system-x86_64 natively
        id: compile
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.patches.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir "$RUNNER_TEMP/qemu-native-build"
          cd "$RUNNER_TEMP/qemu-native-build"
          "$RUNNER_TEMP/qemu-native-src/configure" --target-list=x86_64-softmmu --without-default-features \
            --enable-system --enable-tcg --enable-fdt=system --disable-werror --with-coroutine=ucontext \
            > configure.log 2>&1 || { tail -50 configure.log; exit 1; }
          ninja qemu-system-x86_64 > build.log 2>&1 || { grep -B2 -A12 -E 'error|FAILED' build.log | head -200; exit 1; }
          # Warnings in the files the patches add would be errors in a -Werror build.
          grep -A6 -E '(porty|wasmfb)[^ ]*\.c:[0-9]+:[0-9]+: warning' build.log || echo "no warnings in the Porty files"
          mkdir -p "$GITHUB_WORKSPACE/out/qemu-native/pc-bios"
          cp qemu-system-x86_64 "$GITHUB_WORKSPACE/out/qemu-native/"
          while read -r rom; do
            [[ -n "$rom" ]] || continue
            cp "$RUNNER_TEMP/qemu-native-src/pc-bios/$rom" "$GITHUB_WORKSPACE/out/qemu-native/pc-bios/"
          done < "$GITHUB_WORKSPACE/build/pc-bios.list"

      - name: Save the native QEMU build
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.compile.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/qemu-native
          key: qemu-native-${{ steps.versions.outputs.qemu_commit }}-${{ hashFiles('patches/qemu-wasm/**', 'build/pc-bios.list') }}

      # A stock Ubuntu kernel as the guest: virtio-blk, squashfs and the
      # serial console are built in, so no modules are needed.
      - name: Fetch a guest kernel
        id: kernel
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/kernel"
          cd "$RUNNER_TEMP/kernel"
          pkg="$(apt-cache depends linux-image-generic | awk '$1 == "Depends:" && $2 ~ /^linux-image-[0-9]/ { print $2; exit }')"
          echo "guest kernel package: $pkg"
          apt-get download "$pkg"
          dpkg-deb -x ./*.deb root
          cp root/boot/vmlinuz-* vmlinuz
          ls -l vmlinuz

      - name: Save, pack and resume a guest
        id: test
        if: steps.kernel.outcome == 'success' && (steps.native-cache.outputs.cache-hit == 'true' || steps.compile.outcome == 'success')
        continue-on-error: true
        run: |
          chmod +x out/qemu-native/qemu-system-x86_64
          tests/snapshot-native.sh out/qemu-native/qemu-system-x86_64 out/qemu-native/pc-bios \
            "$RUNNER_TEMP/kernel/vmlinuz" "$RUNNER_TEMP/snapshot-native" | tee "$RUNNER_TEMP/snapshot-native.log"

      - name: Summary
        id: summary
        env:
          TOOLS: ${{ steps.tools.outcome }}
          PATCHES: ${{ steps.patches.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          KERNEL: ${{ steps.kernel.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          if [[ "$TEST" == success ]]; then
            n="$(grep -c '^PASS' "$RUNNER_TEMP/snapshot-native.log" || true)"
            out="success|native QEMU saved and resumed a guest through -incoming porty: ($n checks)"
          elif [[ "$TOOLS" == failure ]]; then out="failure|could not install the build tools"
          elif [[ "$PATCHES" == failure ]]; then out="failure|patches do not apply"
          elif [[ "$COMPILE" == failure ]]; then out="failure|native compile failed, see the log"
          elif [[ "$KERNEL" == failure ]]; then out="failure|could not fetch a guest kernel"
          else out="failure|snapshot test failed: $(grep -m1 '^FAIL' "$RUNNER_TEMP/snapshot-native.log" 2>/dev/null | cut -c7-90 || true)"; fi
          echo "outcome=$out" >> "$GITHUB_OUTPUT"
          { echo "## Native QEMU"; echo; echo "- ${out/|/: }"; } >> "$GITHUB_STEP_SUMMARY"

  # The same guest resumed by the page in the QEMU-Wasm build of this branch
  # (tests/snapshot-browser.sh): the snapshot source under Emscripten, and a
  # stream saved by a native QEMU loaded by the WebAssembly one.  Both builds
  # come from the caches the two jobs before saved.
  resume-e2e:
    name: Resume in QEMU-Wasm (headless Chrome)
    needs: [build, native]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      outcome: ${{ steps.summary.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Read pinned versions
        id: versions
        run: |
          source build/versions.env
          {
            echo "qemu_commit=$QEMU_WASM_COMMIT"
            echo "wasm_memory_mb=$WASM_MEMORY_MB"
          } >> "$GITHUB_OUTPUT"

      - name: Install tools
        id: tools
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          # libfdt1 and libpixman: what the native QEMU of the job before links to
          sudo apt-get install -y -qq xorriso squashfs-tools e2fsprogs qemu-utils busybox-static cpio zstd \
            libfdt1 libpixman-1-0
          (cd web && npm ci --ignore-scripts --no-audit --no-fund)
          (cd tests/ui && npm ci --ignore-scripts --no-audit --no-fund)

      - name: Restore the QEMU-Wasm build
        id: wasm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/qemu
          key: qemu-${{ steps.versions.outputs.qemu_commit }}-${{ steps.versions.outputs.wasm_memory_mb }}-${{ hashFiles('patches/qemu-wasm/**', 'build/build-qemu.sh', 'build/pc-bios.list', 'scripts/wasm-info.py') }}

      - name: Restore the native QEMU build
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/qemu-native
          key: qemu-native-${{ steps.versions.outputs.qemu_commit }}-${{ hashFiles('patches/qemu-wasm/**', 'build/pc-bios.list') }}

      - name: Fetch a guest kernel
        id: kernel
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/kernel"
          cd "$RUNNER_TEMP/kernel"
          pkg="$(apt-cache depends linux-image-generic | awk '$1 == "Depends:" && $2 ~ /^linux-image-[0-9]/ { print $2; exit }')"
          echo "guest kernel package: $pkg"
          apt-get download "$pkg"
          dpkg-deb -x ./*.deb root
          cp root/boot/vmlinuz-* vmlinuz

      - name: Save a guest natively, resume it in the browser
        id: test
        if: steps.kernel.outcome == 'success' && steps.wasm-cache.outputs.cache-hit == 'true' && steps.native-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          PUPPETEER_DIR: ${{ github.workspace }}/tests/ui
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME
          "$CHROME" --version
          chmod +x out/qemu-native/qemu-system-x86_64
          tests/snapshot-browser.sh out/qemu-native/qemu-system-x86_64 out/qemu-native/pc-bios \
            "$RUNNER_TEMP/kernel/vmlinuz" out/qemu "$RUNNER_TEMP/resume-e2e" | tee "$RUNNER_TEMP/resume-e2e.log"

      - name: Summary
        id: summary
        env:
          TOOLS: ${{ steps.tools.outcome }}
          WASM: ${{ steps.wasm-cache.outputs.cache-hit }}
          NATIVE: ${{ steps.native-cache.outputs.cache-hit }}
          KERNEL: ${{ steps.kernel.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          log="$RUNNER_TEMP/resume-e2e.log"
          if [[ "$TEST" == success ]]; then
            out="success|$(grep -m1 -o 'QEMU-Wasm loaded the stream.*' "$log" | cut -c1-120 || true)"
          elif [[ "$TOOLS" == failure ]]; then out="failure|could not install the tools"
          elif [[ "$WASM" != true ]]; then out="failure|no QEMU-Wasm build to test (see porty/check qemu)"
          elif [[ "$NATIVE" != true ]]; then out="failure|no native QEMU build to test (see porty/check native)"
          elif [[ "$KERNEL" == failure ]]; then out="failure|could not fetch a guest kernel"
          else out="failure|$(grep -m1 '^FAIL' "$log" 2>/dev/null | cut -c7-130 || true)"; fi
          echo "outcome=$out" >> "$GITHUB_OUTPUT"
          { echo "## Resume in QEMU-Wasm"; echo; echo "- ${out/|/: }"; } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Report as commit statuses
    needs: [checks, ui-test, disk, build, native, resume-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Post statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LINT: ${{ needs.checks.outputs.outcome }}
          UI: ${{ needs.ui-test.outputs.outcome }}
          QEMU: ${{ needs.build.outputs.qemu }}
          SITE: ${{ needs.build.outputs.site }}
          DISK: ${{ needs.disk.outputs.outcome }}
          NATIVE: ${{ needs.native.outputs.outcome }}
          RESUME: ${{ needs.resume-e2e.outputs.outcome }}
        run: |
          post() { # <context> <state|description>
            local state="${2%%|*}" desc="${2#*|}"
            [[ -n "$2" ]] || { state=error; desc="job did not finish"; }
            gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context="porty/check $1" \
              -f description="${desc:0:140}" -f target_url="$RUN_URL" >/dev/null || true
            echo "$1: $state - $desc"
          }
          post lint "$LINT"
          post ui "$UI"
          post qemu "$QEMU"
          post site "$SITE"
          post disk "$DISK"
          post native "$NATIVE"
          post resume "$RESUME"
